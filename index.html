<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de QR Code (Câmera Traseira)</title>
    <!-- Importando a biblioteca html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-break: break-all;
            text-align: center;
            max-width: 500px;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* ESTILOS DO BANNER HORIZONTAL DINÂMICO */
        .banner-container {
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
        }

        .banner-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 170px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .banner-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.75) 100%);
            z-index: 1;
        }

        .banner-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .banner-content {
            position: relative;
            z-index: 2;
        }

        .banner-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .banner-callout {
            font-size: 0.9em;
            background-color: #007bff;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }

        .banner-card:hover .banner-callout {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Leitor de QR Code</h1>
    <p>Aponte a câmera para ler o QR Code.</p>

    <!-- Área onde o vídeo da câmera será exibido -->
    <div id="reader"></div>

    <!-- Área de mensagens e resultados -->
    <div id="result"></div>

    <!-- Banner Horizontal Dinâmico -->
    <div class="banner-container">
        <a id="dynamic-banner" class="banner-card" href="#" target="_blank" rel="noopener">
            <div class="banner-content">
                <div id="banner-title" class="banner-title">Carregando...</div>
                <div class="banner-callout">clique aqui e saiba mais</div>
            </div>
        </a>
    </div>

    <script>

                url: "https://go.hotmart.com/R107827879N",
                imageUrl: "https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=800&q=80"
            },
            {
                title: "Curso de Eletrônica",
                url: "https://go.hotmart.com/Y107827491V",
                imageUrl: "https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?auto=format&fit=crop&w=800&q=80"
            }
        ];

        function updateBanner() {
            if (bannerItems.length === 0) return;

            const randomIndex = Math.floor(Math.random() * bannerItems.length);
            const selectedItem = bannerItems[randomIndex];

            const bannerElement = document.getElementById('dynamic-banner');
            const titleElement = document.getElementById('banner-title');

            titleElement.innerText = selectedItem.title;
            bannerElement.href = selectedItem.url;
            bannerElement.style.backgroundImage = `url('${selectedItem.imageUrl}')`;
        }

        updateBanner();
        setInterval(updateBanner, 300000);

        // CONFIGURAÇÃO E LÓGICA DO QR CODE
        const html5QrCode = new Html5Qrcode("reader");

        const qrConfig = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 } 
        };

        function onScanSuccess(decodedText, decodedResult) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="alert-success">QR Code lido! Redirecionando...</div>`;

            html5QrCode.stop().then(() => {
                if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                    window.location.href = decodedText;
                } else {
                    window.location.href = "https://" + decodedText;
                }
            }).catch(err => {
                console.error("Erro ao parar a câmera:", err);
            });
        }

        function handleCameraError(err) {
            console.error("Erro ao iniciar a câmera:", err);
            document.getElementById('result').innerHTML = 
                `<p style="color:red;">Não foi possível acessar a câmera. Verifique se concedeu permissão no app/navegador e se a conexão é HTTPS.</p>`;
        }

        // Inicialização direta solicitando a câmera traseira (ideal para WebViews)
        function startCamera() {
            html5QrCode.start(
                { facingMode: "environment" }, 
                qrConfig, 
                onScanSuccess
            ).catch(err => {
                // Se falhar a traseira (ex: em notebook), tenta qualquer câmera disponível
                html5QrCode.start(
                    { facingMode: "user" }, 
                    qrConfig, 
                    onScanSuccess
                ).catch(errFallback => handleCameraError(errFallback));
            });
        }

        startCamera();
    </script>
</body>
</html>
